name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK 10.0.26100
        shell: pwsh
        run: |
          # Try standalone installer first, fall back to vs_installer
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          if (Test-Path "$sdkDir") {
            Write-Host "SDK 10.0.26100.0 already present at $sdkDir"
            exit 0
          }
          Write-Host "Downloading Windows SDK 10.0.26100 standalone installer..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2327008"
          $out = "$env:TEMP\winsdksetup.exe"
          curl.exe -sL $url -o $out
          if (-not (Test-Path $out)) {
            Write-Warning "Standalone download failed, trying vs_installer..."
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\vs_installer.exe" modify `
              --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.Windows10SDK.26100 `
              --quiet
          } else {
            Write-Host "Installing SDK silently (this may take a few minutes)..."
            Start-Process -Wait -FilePath $out -ArgumentList "/quiet", "/norestart"
          }
          if (-not (Test-Path "$sdkDir")) {
            Write-Error "SDK 10.0.26100.0 installation failed - include directory not found at $sdkDir"
            exit 1
          }
          Write-Host "SDK 10.0.26100.0 confirmed at $sdkDir"

      - name: Verify WDK availability
        shell: pwsh
        run: |
          $wdmH = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\wdm.h"
          if (-not (Test-Path "$wdmH")) {
            $alt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\km\wdm.h" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $alt) {
              Write-Error "No WDK found. The WindowsKernelModeDriver10.0 toolset is required."
              exit 1
            }
            Write-Warning "WDK 10.0.26100.0 not found, using fallback: $($alt.Directory.Parent.Parent.FullName)"
          } else {
            Write-Host "WDK 10.0.26100.0 confirmed"
          }

      # Build both architectures for Windows
      # Note: WDK 10.0.26100 does NOT support x86 (Win32) kernel-mode drivers.
      - name: Build x64 Release (driver + tools)
        run: msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /m
      - name: Build x86 tools only (Ext2Srv + Ext2Mgr)
        run: |
          msbuild Ext2Srv\Ext2Srv.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild Ext2Mgr\Ext2Mgr.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # Upload driver artifacts
      - name: Upload signed-x64
        uses: actions/upload-artifact@v4
        with:
          name: signed-x64
          path: Ext4Fsd/Release/x64/Ext2Fsd.sys
          if-no-files-found: error

      # Install NSIS and prepare VC++ redist files for the installer
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          # Stage DLLs per architecture so NSIS can embed the correct versions.
          # NSIS is 32-bit so accessing C:\Windows\System32 hits the WOW64
          # redirector - we stage to a temp dir to avoid that.
          $stagingX64 = "$env:TEMP\redist\x64"
          $stagingX86 = "$env:TEMP\redist\x86"
          Remove-Item -Recurse -Force "$env:TEMP\redist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stagingX64 | Out-Null
          New-Item -ItemType Directory -Force -Path $stagingX86 | Out-Null

          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $okX64 = $false; $okX86 = $false

          # Strategy 1: VC\Redist\MSVC (latest version folder)
          $redirRoot = "$vsPath\VC\Redist\MSVC"
          $verDirs = Get-ChildItem $redirRoot -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending
          if ($verDirs) {
            $ver = $verDirs[0].Name
            Write-Host "Found VC\Redist\MSVC\$ver"
            foreach ($arch in @("x64", "x86")) {
              $target = if ($arch -eq "x64") { $stagingX64 } else { $stagingX86 }
              foreach ($sub in @("Microsoft.VC143.CRT", "Microsoft.VC143.CRT.merged")) {
                $d = "$redirRoot\$ver\$arch\$sub"
                if (Test-Path "$d\vcruntime140.dll") {
                  Copy-Item "$d\*.dll" $target -ErrorAction SilentlyContinue
                  if ($arch -eq "x64") { $okX64 = $true } else { $okX86 = $true }
                  Write-Host "  $arch DLLs from $sub"
                  break
                }
              }
            }
          }

          # Strategy 2: stage from system directories
          # From 64-bit PowerShell, System32 = 64-bit DLLs, SysWOW64 = 32-bit DLLs
          if (-not $okX64) {
            Write-Host "x64 fallback: staging from System32..."
            Copy-Item "$env:SystemRoot\System32\vcruntime140*.dll" $stagingX64 -ErrorAction SilentlyContinue
            Copy-Item "$env:SystemRoot\System32\mfc140.dll" $stagingX64 -ErrorAction SilentlyContinue
            $okX64 = Test-Path "$stagingX64\vcruntime140.dll"
            if ($okX64) { Write-Host "  x64 DLLs staged from System32" }
          }
          if (-not $okX86) {
            Write-Host "x86 fallback: staging from SysWOW64..."
            Copy-Item "$env:SystemRoot\SysWOW64\vcruntime140.dll" $stagingX86 -ErrorAction SilentlyContinue
            Copy-Item "$env:SystemRoot\SysWOW64\mfc140.dll" $stagingX86 -ErrorAction SilentlyContinue
            $okX86 = Test-Path "$stagingX86\vcruntime140.dll"
            if ($okX86) { Write-Host "  x86 DLLs staged from SysWOW64" }
          }

          # Log what we found
          Get-ChildItem "$env:TEMP\redist" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  Staged $($_.FullName)" }

          # Build makensis arguments
          $mkaArgs = @()
          if ($okX64) { $mkaArgs += "/DMSVPATH_X64=$stagingX64"; $mkaArgs += "/DMFCPATH_X64=$stagingX64" }
          if ($okX86) { $mkaArgs += "/DMSVPATH_X86=$stagingX86"; $mkaArgs += "/DMFCPATH_X86=$stagingX86" }

          # Check x86 driver
          $x86Driver = "Ext4Fsd\Release\x86\Ext2Fsd.sys"
          if (Test-Path $x86Driver) {
            Write-Host "x86 driver found, including in installer"
            $mkaArgs += "/DX86_DRIVER_AVAILABLE"
          } else {
            Write-Host "x86 driver not available (WDK 26100 limitation), skipping from installer"
          }

          Push-Location Setup
          Write-Host "Running: makensis $($mkaArgs -join ' ') ext2fsd.nsi"
          & "C:\Program Files (x86)\NSIS\makensis.exe" $mkaArgs "ext2fsd.nsi"
          $ok = $?
          Pop-Location
          if (-not $ok) { exit 1 }

      - name: Upload Ext2Fsd-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Fsd-setup
          path: Setup/Ext2Fsd-setup.exe
          if-no-files-found: error

      # Also upload management tools for convenience
      - name: Upload Ext2Mgr
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Mgr
          path: Ext2Mgr/Release/x64/Ext2Mgr.exe
          if-no-files-found: warn
