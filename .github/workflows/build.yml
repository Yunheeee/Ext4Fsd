name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK 10.0.26100
        shell: pwsh
        run: |
          # Try standalone installer first, fall back to vs_installer
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          if (Test-Path "$sdkDir") {
            Write-Host "SDK 10.0.26100.0 already present at $sdkDir"
            exit 0
          }
          Write-Host "Downloading Windows SDK 10.0.26100 standalone installer..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2327008"
          $out = "$env:TEMP\winsdksetup.exe"
          curl.exe -sL $url -o $out
          if (-not (Test-Path $out)) {
            Write-Warning "Standalone download failed, trying vs_installer..."
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\vs_installer.exe" modify `
              --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.Windows10SDK.26100 `
              --quiet
          } else {
            Write-Host "Installing SDK silently (this may take a few minutes)..."
            Start-Process -Wait -FilePath $out -ArgumentList "/quiet", "/norestart"
          }
          if (-not (Test-Path "$sdkDir")) {
            Write-Error "SDK 10.0.26100.0 installation failed - include directory not found at $sdkDir"
            exit 1
          }
          Write-Host "SDK 10.0.26100.0 confirmed at $sdkDir"

      - name: Verify WDK availability
        shell: pwsh
        run: |
          $wdmH = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\wdm.h"
          if (-not (Test-Path "$wdmH")) {
            $alt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\km\wdm.h" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $alt) {
              Write-Error "No WDK found. The WindowsKernelModeDriver10.0 toolset is required."
              exit 1
            }
            Write-Warning "WDK 10.0.26100.0 not found, using fallback: $($alt.Directory.Parent.Parent.FullName)"
          } else {
            Write-Host "WDK 10.0.26100.0 confirmed"
          }

      # Build both architectures for Windows
      # Note: WDK 10.0.26100 does NOT support x86 (Win32) kernel-mode drivers.
      - name: Build x64 Release (driver + tools)
        run: msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /m
      - name: Build x86 tools only (Ext2Srv + Ext2Mgr)
        run: |
          msbuild Ext2Srv\Ext2Srv.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild Ext2Mgr\Ext2Mgr.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # Upload driver artifacts
      - name: Upload signed-x64
        uses: actions/upload-artifact@v4
        with:
          name: signed-x64
          path: Ext4Fsd/Release/x64/Ext2Fsd.sys
          if-no-files-found: error

      # Install NSIS
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      # Debug step: list VS Redist structure and system DLL locations
      - name: Diagnose DLL locations
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          "=== VC\Redist\MSVC ==="
          dir "$vsPath\VC\Redist\MSVC" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
          "=== System32 VC DLLs ==="
          dir "$env:SystemRoot\System32\vcruntime*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
          dir "$env:SystemRoot\System32\mfc140.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
          "=== SysWOW64 VC DLLs ==="
          dir "$env:SystemRoot\SysWOW64\vcruntime*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
          dir "$env:SystemRoot\SysWOW64\mfc140.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }
        continue-on-error: true

      - name: Build setup.exe
        shell: pwsh
        run: |
          # Stage DLLs per architecture. NSIS is 32-bit, so accessing
          # C:\Windows\System32 from it triggers the WOW64 redirector.
          # We stage to temp dirs from 64-bit PowerShell to avoid that.
          $stagingX64 = "$env:TEMP\redist\x64"
          $stagingX86 = "$env:TEMP\redist\x86"
          Remove-Item -Recurse -Force "$env:TEMP\redist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stagingX64 | Out-Null
          New-Item -ItemType Directory -Force -Path $stagingX86 | Out-Null

          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $needed = @("vcruntime140.dll", "vcruntime140_1.dll", "mfc140.dll")

          # Try VS Redist MSVC directory
          Write-Host "=== Strategy 1: VC\Redist\MSVC ==="
          $redirRoot = "$vsPath\VC\Redist\MSVC"
          if (Test-Path $redirRoot) {
            Get-ChildItem $redirRoot -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            # Copy x64 DLLs
            Get-ChildItem "$redirRoot" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\x64\\' -or $_.DirectoryName -match '\\amd64\\' } |
              Copy-Item -Destination $stagingX64 -ErrorAction SilentlyContinue
            # Copy x86 DLLs
            Get-ChildItem "$redirRoot" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\x86\\' -or $_.DirectoryName -match '\\x32\\' } |
              Copy-Item -Destination $stagingX86 -ErrorAction SilentlyContinue
          } else {
            Write-Host "  VC\Redist\MSVC not found"
          }

          # Try system directories (64-bit PS -> System32 = 64-bit, SysWOW64 = 32-bit)
          if (-not (Test-Path "$stagingX64\vcruntime140.dll")) {
            Write-Host "=== Strategy 2: System32 ==="
            foreach ($dll in $needed) {
              $src = "$env:SystemRoot\System32\$dll"
              if (Test-Path $src) {
                Copy-Item $src "$stagingX64\$dll" -Force -ErrorAction SilentlyContinue
                Write-Host "  Copied $dll"
              } else {
                Write-Host "  $dll NOT found in System32"
              }
            }
          }
          if (-not (Test-Path "$stagingX86\vcruntime140.dll")) {
            Write-Host "=== Strategy 3: SysWOW64 ==="
            foreach ($dll in $needed) {
              $src = "$env:SystemRoot\SysWOW64\$dll"
              if (Test-Path $src) {
                Copy-Item $src "$stagingX86\$dll" -Force -ErrorAction SilentlyContinue
                Write-Host "  Copied $dll"
              } else {
                Write-Host "  $dll NOT found in SysWOW64"
              }
            }
          }

          # Log everything staged
          Write-Host "=== Staged DLLs ==="
          Get-ChildItem "$env:TEMP\redist" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }

          # Prepare makensis flags - only define paths that actually have DLLs
          $mkaArgs = @()
          $haveX64 = Test-Path "$stagingX64\vcruntime140.dll"
          $haveX86 = Test-Path "$stagingX86\vcruntime140.dll"
          $haveMfcX64 = Test-Path "$stagingX64\mfc140.dll"
          $haveMfcX86 = Test-Path "$stagingX86\mfc140.dll"

          if ($haveX64) { $mkaArgs += "/DMSVPATH_X64=$stagingX64"; $mkaArgs += "/DHAS_VCRT_X64" }
          if ($haveX86) { $mkaArgs += "/DMSVPATH_X86=$stagingX86"; $mkaArgs += "/DHAS_VCRT_X86" }
          if ($haveMfcX64) { $mkaArgs += "/DMFCPATH_X64=$stagingX64"; $mkaArgs += "/DHAS_MFC_X64" }
          if ($haveMfcX86) { $mkaArgs += "/DMFCPATH_X86=$stagingX86"; $mkaArgs += "/DHAS_MFC_X86" }

          # Check x86 driver
          $x86Driver = "Ext4Fsd\Release\x86\Ext2Fsd.sys"
          if (Test-Path $x86Driver) {
            Write-Host "x86 driver found, including in installer"
            $mkaArgs += "/DX86_DRIVER_AVAILABLE"
          } else {
            Write-Host "x86 driver not available (WDK 26100 limitation), skipping from installer"
          }

          Push-Location Setup
          Write-Host "Running: makensis $($mkaArgs -join ' ') ext2fsd.nsi"
          & "C:\Program Files (x86)\NSIS\makensis.exe" $mkaArgs "ext2fsd.nsi"
          $ok = $?
          Pop-Location
          if (-not $ok) { exit 1 }

      - name: Upload Ext2Fsd-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Fsd-setup
          path: Setup/Ext2Fsd-setup.exe
          if-no-files-found: error

      # Also upload management tools for convenience
      - name: Upload Ext2Mgr
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Mgr
          path: Ext2Mgr/Release/x64/Ext2Mgr.exe
          if-no-files-found: warn
