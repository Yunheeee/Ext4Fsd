name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK 10.0.26100
        shell: pwsh
        run: |
          # Try standalone installer first, fall back to vs_installer
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          if (Test-Path "$sdkDir") {
            Write-Host "SDK 10.0.26100.0 already present at $sdkDir"
            exit 0
          }
          Write-Host "Downloading Windows SDK 10.0.26100 standalone installer..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2327008"
          $out = "$env:RUNNER_TEMP\winsdksetup.exe"
          curl.exe -sL $url -o $out
          if (-not (Test-Path $out)) {
            Write-Warning "Standalone download failed, trying vs_installer..."
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\vs_installer.exe" modify `
              --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.Windows10SDK.26100 `
              --quiet
          } else {
            Write-Host "Installing SDK silently (this may take a few minutes)..."
            Start-Process -Wait -FilePath $out -ArgumentList "/quiet", "/norestart"
          }
          if (-not (Test-Path "$sdkDir")) {
            Write-Error "SDK 10.0.26100.0 installation failed - include directory not found at $sdkDir"
            exit 1
          }
          Write-Host "SDK 10.0.26100.0 confirmed at $sdkDir"

      - name: Verify WDK availability
        shell: pwsh
        run: |
          $wdmH = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\wdm.h"
          if (-not (Test-Path "$wdmH")) {
            $alt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\km\wdm.h" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $alt) {
              Write-Error "No WDK found. The WindowsKernelModeDriver10.0 toolset is required."
              exit 1
            }
            Write-Warning "WDK 10.0.26100.0 not found, using fallback: $($alt.Directory.Parent.Parent.FullName)"
          } else {
            Write-Host "WDK 10.0.26100.0 confirmed"
          }

      # Build both architectures for Windows
      # Note: WDK 10.0.26100 does NOT support x86 (Win32) kernel-mode drivers.
      - name: Build x64 Release (driver + tools)
        run: msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /m
      - name: Build x86 tools only (Ext2Srv + Ext2Mgr)
        run: |
          msbuild Ext2Srv\Ext2Srv.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild Ext2Mgr\Ext2Mgr.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # Upload driver artifacts
      - name: Upload signed-x64
        uses: actions/upload-artifact@v4
        with:
          name: signed-x64
          path: Ext4Fsd/Release/x64/Ext2Fsd.sys
          if-no-files-found: error

      # Install NSIS
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          # Capture ALL output to a log file for debugging
          $logFile = "$env:RUNNER_TEMP\build_setup.log"
          function log($msg) { $msg | Out-File $logFile -Append; Write-Host $msg }

          log "=== Starting Build setup.exe ==="
          log "SystemRoot: $env:SystemRoot"
          log "Temp: $env:RUNNER_TEMP"

          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          log "VS Path: $vsPath"

          $stagingX64 = "$env:RUNNER_TEMP\redist\x64"
          $stagingX86 = "$env:RUNNER_TEMP\redist\x86"
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\redist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stagingX64 | Out-Null
          New-Item -ItemType Directory -Force -Path $stagingX86 | Out-Null
          $needed = @("vcruntime140.dll", "vcruntime140_1.dll", "mfc140.dll")

          # ---- STRATEGY 1: VC\Redist\MSVC ----
          log "=== Strategy 1: VC\Redist\MSVC ==="
          $redirRoot = "$vsPath\VC\Redist\MSVC"
          log "Checking: $redirRoot"
          if (Test-Path $redirRoot) {
            log "Redist directory exists"
            $allDlls = Get-ChildItem "$redirRoot" -Recurse -Include "*.dll" -ErrorAction SilentlyContinue
            if ($allDlls) {
              $allDlls | ForEach-Object { log "  Found DLL: $($_.FullName)" }
              # Copy x64 DLLs
              $allDlls | Where-Object { $_.DirectoryName -match 'x64' } |
                Copy-Item -Destination $stagingX64 -ErrorAction SilentlyContinue
              # Copy x86 DLLs
              $allDlls | Where-Object { $_.DirectoryName -match 'x86' -and $_.DirectoryName -notmatch 'x64' } |
                Copy-Item -Destination $stagingX86 -ErrorAction SilentlyContinue
            } else {
              log "No DLLs found in Redist directory"
            }
          } else {
            log "Redist directory NOT found"
          }

          # ---- STRATEGY 2: System directories ----
          log "=== Strategy 2: System32 (x64) ==="
          foreach ($dll in $needed) {
            $src = "$env:SystemRoot\System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src "$stagingX64\$dll" -Force -ErrorAction SilentlyContinue
              log "  x64: $dll OK"
            } else {
              log "  x64: $dll MISSING"
            }
          }
          log "=== Strategy 3: SysWOW64 (x86) ==="
          foreach ($dll in $needed) {
            $src = "$env:SystemRoot\SysWOW64\$dll"
            if (Test-Path $src) {
              Copy-Item $src "$stagingX86\$dll" -Force -ErrorAction SilentlyContinue
              log "  x86: $dll OK"
            } else {
              log "  x86: $dll MISSING"
            }
          }

          # ---- LOG STAGED DLLS ----
          log "=== Staged DLLs ==="
          Get-ChildItem "$env:RUNNER_TEMP\redist" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { log "  $($_.FullName)" }

          # ---- CHECK MAKENSIS ----
          log "=== Checking NSIS ==="
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            log "makensis found at $makensis"
            $ver = & $makensis -version 2>&1
            log "NSIS version: $ver"
          } else {
            log "ERROR: makensis NOT FOUND at $makensis"
            exit 1
          }


          # ---- PREPARE MAKENSIS FLAGS ----
          log "=== Preparing makensis flags ==="
          $mkaArgs = @()
          if (Test-Path "$stagingX64\vcruntime140.dll") {
            $mkaArgs += "/DMSVPATH_X64=$stagingX64"
            $mkaArgs += "/DHAS_VCRT_X64"
            log "  x64 CRT: $stagingX64"
          }
          if (Test-Path "$stagingX86\vcruntime140.dll") {
            $mkaArgs += "/DMSVPATH_X86=$stagingX86"
            $mkaArgs += "/DHAS_VCRT_X86"
            log "  x86 CRT: $stagingX86"
          }
          if (Test-Path "$stagingX64\mfc140.dll") {
            $mkaArgs += "/DMFCPATH_X64=$stagingX64"
            $mkaArgs += "/DHAS_MFC_X64"
            log "  x64 MFC: $stagingX64"
          }
          if (Test-Path "$stagingX86\mfc140.dll") {
            $mkaArgs += "/DMFCPATH_X86=$stagingX86"
            $mkaArgs += "/DHAS_MFC_X86"
            log "  x86 MFC: $stagingX86"
          }

          # Check x86 driver
          $x86Driver = "Ext4Fsd\Release\x86\Ext2Fsd.sys"
          if (Test-Path $x86Driver) {
            log "x86 driver found, including in installer"
            $mkaArgs += "/DX86_DRIVER_AVAILABLE"
          } else {
            log "x86 driver not available (WDK 26100 limitation), skipping from installer"
          }

          # Check catalog file (security catalog for driver signing)
          $catFile = "Ext4Fsd\Release\x64\Ext2Fsd.cat"
          if (Test-Path $catFile) {
            log "x64 catalog file found, including in installer"
            $mkaArgs += "/DHAS_CAT_X64"
          } else {
            log "x64 catalog file not found, skipping from installer"
          }

          Push-Location Setup
          log "=== Running makensis ==="
          log "  Command: makensis $($mkaArgs -join ' ') ext2fsd.nsi"
          & $makensis $mkaArgs "ext2fsd.nsi" 2>&1 | ForEach-Object { log "  $_" }
          $exitCode = $LASTEXITCODE
          log "makensis exit code: $exitCode"
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-setup-log
          path: ${{ runner.temp }}\build_setup.log
          if-no-files-found: warn

      - name: Upload Ext2Fsd-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Fsd-setup
          path: Setup/Ext2Fsd-setup.exe
          if-no-files-found: error

      # Also upload management tools for convenience
      - name: Upload Ext2Mgr
        uses: actions/upload-artifact@v4
        with:
          name: Ext2Mgr
          path: Ext2Mgr/Release/x64/Ext2Mgr.exe
          if-no-files-found: warn
